name: omc-opencode-release
run-name: "omc-opencode-release ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (e.g., 1.0.0-beta.1). Takes precedence over bump."
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - name: Calculate version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION="$RAW_VERSION"
          if [ -z "$VERSION" ]; then
            RESPONSE=$(curl -sf https://registry.npmjs.org/oh-my-codes-opencode/latest 2>/dev/null || echo '{}')
            PREV=$(echo "$RESPONSE" | jq -r '.version // "0.0.0"' 2>/dev/null || echo "0.0.0")
            if [ -z "$PREV" ] || [ "$PREV" = "null" ]; then PREV="0.0.0"; fi
            BASE="${PREV%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) VERSION="$((MAJOR+1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              *) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" == *"-"* ]]; then
            DIST_TAG=$(printf '%s' "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            if ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "::error::Invalid dist_tag: $DIST_TAG"
              exit 1
            fi
            echo "dist_tag=${DIST_TAG:-next}" >> $GITHUB_OUTPUT
          else
            echo "dist_tag=" >> $GITHUB_OUTPUT
          fi

          echo "Version: $VERSION"

  build-and-publish:
    needs: [calculate-version]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.calculate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-codes-opencode/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "oh-my-codes-opencode@${VERSION} already published"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' packages/omc-opencode/package.json > tmp.json && mv tmp.json packages/omc-opencode/package.json

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: yarn oc build

      - name: Copy README
        if: steps.check.outputs.skip != 'true'
        run: cp README.md packages/omc-opencode/README.md

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        env:
          DIST_TAG: ${{ needs.calculate-version.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          cd packages/omc-opencode
          if [ -n "$DIST_TAG" ]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --access public
          fi

  release:
    needs: [calculate-version, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Generate changelog
        run: |
          node scripts/generate-changelog.mjs > /tmp/changelog.md
          cat /tmp/changelog.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply release version
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' packages/omc-opencode/package.json > tmp.json && mv tmp.json packages/omc-opencode/package.json

      - name: Commit version bump
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages/omc-opencode/package.json
          git diff --cached --quiet || git commit -m "release: oh-my-codes-opencode v${VERSION}"

      - name: Create release tag
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          if git rev-parse "oh-my-codes-opencode-v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag oh-my-codes-opencode-v${VERSION} already exists"
            exit 1
          fi
          git tag "oh-my-codes-opencode-v${VERSION}"

      - name: Push release state
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD
          git push origin "oh-my-codes-opencode-v${VERSION}"

      - name: Create GitHub release
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "oh-my-codes-opencode-v${VERSION}" >/dev/null 2>&1 || \
            gh release create "oh-my-codes-opencode-v${VERSION}" --title "oh-my-codes-opencode v${VERSION}" --notes-file /tmp/changelog.md
